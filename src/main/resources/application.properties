spring.application.name=web-crawler

# ==========================================
# MySQL Database Configuration
# ==========================================
# Replace 'your_database_name' with your actual MySQL database name
spring.datasource.url=jdbc:mysql://localhost:3306/web_crawler_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Replace with your MySQL username and password
spring.datasource.username=root
spring.datasource.password=rohit 

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# Options: create, create-drop, update, validate, none
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries and format them in console logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect (Recommended for MySQL 8+)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
